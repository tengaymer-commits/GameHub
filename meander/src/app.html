<title>Meander Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; ambient lilac blobs drift behind; fixed tab bar at the bottom. */
:root{
  --bg:#F4EEFA; --surface:#FFFCFF; --surface-2:#ECE2F8; --ink:#24152F; --muted:#6C5A80; --line:#DACBEB;
  --plum:#5B2E91; --plum-ink:#FFFFFF; --lilac:#B58BE8; --orchid:#B83F86;
  --glow1:#CDAAF5; --glow2:#F3BCDB; --glow3:#B3C0F7;
  --w-storm:#555A92; --w-fog:#A99CBB; --w-mild:#9B7BD3; --w-bright:#E386BE; --w-radiant:#EFAE45;
  --shadow:0 14px 34px -22px rgba(64,22,110,.55);
  --display:"Gloock", "Iowan Old Style", Georgia, serif;
  --body:"Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#140C1D; --surface:#1E1430; --surface-2:#2A1D40; --ink:#F1E9FA; --muted:#AE9DC6; --line:#3A2B54;
  --plum:#BC97F4; --plum-ink:#1A0F28; --lilac:#8B63C9; --orchid:#F07FBE;
  --glow1:#4A2779; --glow2:#5E2650; --glow3:#283672;
  --w-storm:#7C82C4; --w-fog:#8E82A2; --w-mild:#A586E0; --w-bright:#EC8FC6; --w-radiant:#F2B65A;
  --shadow:0 14px 34px -20px rgba(0,0,0,.8); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#140C1D; --surface:#1E1430; --surface-2:#2A1D40; --ink:#F1E9FA; --muted:#AE9DC6; --line:#3A2B54;
  --plum:#BC97F4; --plum-ink:#1A0F28; --lilac:#8B63C9; --orchid:#F07FBE;
  --glow1:#4A2779; --glow2:#5E2650; --glow3:#283672;
  --w-storm:#7C82C4; --w-fog:#8E82A2; --w-mild:#A586E0; --w-bright:#EC8FC6; --w-radiant:#F2B65A;
  --shadow:0 14px 34px -20px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow-x:hidden}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:2px solid var(--plum); outline-offset:2px; border-radius:10px}

/* ambient sky */
.sky{position:fixed; inset:0 0 auto 0; height:420px; z-index:0; pointer-events:none; overflow:hidden}
.blob{position:absolute; border-radius:50%; filter:blur(48px); opacity:.75}
.blob.a{width:280px;height:240px;background:var(--glow1);left:-60px;top:-70px;animation:drift 22s ease-in-out infinite alternate}
.blob.b{width:220px;height:200px;background:var(--glow2);right:-50px;top:10px;animation:drift 26s ease-in-out infinite alternate-reverse}
.blob.c{width:240px;height:180px;background:var(--glow3);left:35%;top:140px;opacity:.5;animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,30px) scale(1.12) rotate(18deg)}}

.app{position:relative; z-index:1; max-width:480px; margin:0 auto; padding-inline:18px; padding-block:18px 120px; display:flex; flex-direction:column; gap:22px}

/* type */
h1,h2,h3{font-family:var(--display); font-weight:400; margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:2.35rem; line-height:1.05}
h2{font-size:1.45rem; line-height:1.15}
.eyebrow{font-size:.75rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
p{margin:0}

/* header */
.top{display:flex; align-items:flex-start; gap:10px}
.top .grow{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}
.iconbtn{width:40px; height:40px; border-radius:14px; display:grid; place-items:center; color:var(--ink); background:color-mix(in srgb, var(--surface) 70%, transparent); border:1px solid var(--line); flex:none}
.iconbtn svg{width:20px;height:20px}
.daynav{display:flex; gap:6px; align-items:center}
.backtoday{font-size:.8rem; font-weight:600; color:var(--plum); padding:4px 10px; border-radius:99px; background:var(--surface-2)}

/* weather */
.weather{display:flex; flex-direction:column; gap:10px}
.wx-row{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.wx{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 2px 8px; border-radius:18px; border:1px solid transparent; font-size:.72rem; font-weight:600; color:var(--muted); transition:transform .2s, background .2s}
.wx svg{width:28px;height:28px}
.wx:active{transform:scale(.94)}
.wx[aria-pressed="true"]{background:var(--surface); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow)}
.wx[aria-pressed="true"] svg{color:var(--wc)}
.pace{font-family:var(--display); font-size:1.15rem; line-height:1.3; color:var(--ink)}

/* cards */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow)}
.sec{display:flex; flex-direction:column; gap:12px}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
.count{font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums; font-weight:600}

/* tide divider */
.tideline{display:block; width:100%; height:12px; color:var(--lilac); opacity:.7}

/* intention */
.intent{width:100%; border:0; background:transparent; font-family:var(--display); font-size:1.3rem; line-height:1.3; resize:none; padding:0; color:var(--ink); min-height:1.6em}
.intent::placeholder{color:var(--muted); opacity:.7}
.intent:focus{outline:none}

/* anchors */
.anchors{display:flex; flex-wrap:wrap; gap:8px}
.anchor{display:flex; align-items:center; gap:8px; padding:9px 14px 9px 9px; border-radius:99px; background:var(--surface-2); font-size:.92rem; font-weight:500; border:1px solid transparent; transition:background .2s, color .2s}
.anchor .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--lilac); display:grid; place-items:center; flex:none}
.anchor .dot svg{width:14px;height:14px;opacity:0}
.anchor[aria-pressed="true"]{background:var(--plum); color:var(--plum-ink)}
.anchor[aria-pressed="true"] .dot{border-color:var(--plum-ink); background:var(--plum-ink); color:var(--plum)}
.anchor[aria-pressed="true"] .dot svg{opacity:1}

/* add form */
.adder{display:flex; flex-direction:column; gap:10px}
.field{display:flex; gap:8px}
.field input{flex:1; min-width:0; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--bg)}
.field input:focus{outline:2px solid var(--lilac); outline-offset:0}
.btn{padding:11px 16px; border-radius:14px; background:var(--plum); color:var(--plum-ink); font-weight:600; font-size:.92rem; white-space:nowrap}
.btn.ghost{background:var(--surface-2); color:var(--ink)}
.btn.line{background:transparent; border:1px solid var(--line); color:var(--ink)}
.btn:active{transform:scale(.97)}
.seg{display:flex; gap:4px; padding:4px; background:var(--surface-2); border-radius:14px}
.seg button{flex:1; padding:7px 4px; border-radius:10px; font-size:.82rem; font-weight:600; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 2px 6px -3px rgba(40,10,70,.35)}

/* tides */
.tide{display:flex; flex-direction:column; gap:4px}
.tide-name{display:flex; align-items:center; gap:8px; font-size:.78rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding-block:6px}
.tide-name svg{width:16px;height:16px;color:var(--lilac)}
.empty{font-size:.88rem; color:var(--muted); font-style:italic; padding:4px 0 6px 30px}
.task{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px dashed var(--line)}
.tide-name + .task{border-top:0}
.check{width:24px;height:24px;border-radius:9px 12px 10px 13px;border:2px solid var(--lilac);flex:none;display:grid;place-items:center}
.check svg{width:14px;height:14px;opacity:0}
.task.done .check{background:var(--lilac); border-color:var(--lilac); color:var(--plum-ink)}
:root .task.done .check{color:var(--surface)}
.task.done .check svg{opacity:1}
.task .txt{flex:1; min-width:0; overflow-wrap:anywhere}
.task.done .txt{color:var(--muted); text-decoration:line-through; text-decoration-color:var(--lilac)}
.task .mini{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.task .mini svg{width:17px;height:17px}
.task .mini:hover{background:var(--surface-2); color:var(--ink)}

/* banners */
.note{display:flex; flex-direction:column; gap:10px; padding:14px 16px; border-radius:var(--r); background:var(--surface-2); border:1px dashed var(--lilac)}
.note .row{display:flex; gap:8px; flex-wrap:wrap}
.note .btn.ghost{background:var(--surface)}

/* week */
.weekhead{display:flex; align-items:center; gap:8px}
.weekhead .grow{flex:1; min-width:0}
.days{display:flex; flex-direction:column; gap:8px}
.daycard{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px; padding:12px 14px; border-radius:18px; background:var(--surface); border:1px solid var(--line); text-align:left; width:100%}
.daycard.today{border-color:var(--plum); box-shadow:var(--shadow)}
.daycard .dname{font-weight:600}
.daycard .dsub{font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums}
.bar{height:6px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; background:var(--lilac); border-radius:6px}
.wblob{width:34px;height:34px;border-radius:58% 42% 55% 45% / 48% 60% 40% 52%; background:var(--wc, var(--surface-2)); flex:none}
.wblob.none{background:transparent; border:2px dashed var(--line)}

/* jar */
.pull{align-items:flex-start}
.pulled{font-family:var(--display); font-size:1.5rem; line-height:1.2}
.drifts{display:flex; flex-direction:column}
.drift{display:flex; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--line)}
.drift:first-child{border-top:0}
.drift .txt{flex:1; min-width:0; overflow-wrap:anywhere}
.drift .when{font-size:.75rem; color:var(--muted)}
.chip{padding:6px 10px; border-radius:99px; background:var(--surface-2); font-size:.8rem; font-weight:600; white-space:nowrap}

/* reflect */
.prompt{font-family:var(--display); font-size:1.35rem; line-height:1.25}
textarea.journal{width:100%; min-height:120px; border-radius:14px; border:1px solid var(--line); background:var(--bg); padding:12px 14px; resize:vertical; line-height:1.55}
textarea.journal:focus,.good input:focus{outline:2px solid var(--lilac); outline-offset:0}
.good{display:flex; flex-direction:column; gap:8px}
.good label{display:flex; align-items:center; gap:10px}
.good span{font-family:var(--display); color:var(--lilac); width:16px; text-align:center}
.good input{flex:1; min-width:0; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg)}
.history{display:grid; grid-template-columns:repeat(14,1fr); gap:4px; align-items:end}
.history div{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.65rem; color:var(--muted); font-variant-numeric:tabular-nums}
.history .wblob{width:100%; height:auto; aspect-ratio:1; max-width:22px}
.legend{display:flex; flex-wrap:wrap; gap:10px; font-size:.75rem; color:var(--muted)}
.legend span{display:flex; align-items:center; gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--wc)}
.rhythm{display:grid; grid-template-columns:minmax(0,1fr) repeat(7,18px); gap:8px 6px; align-items:center; font-size:.85rem}
.rhythm .lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rhythm .d{width:14px;height:14px;border-radius:50%;border:2px solid var(--line); justify-self:center}
.rhythm .d.on{background:var(--plum); border-color:var(--plum)}
.rhythm .h{font-size:.68rem; color:var(--muted); text-align:center}

/* nav */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:5; padding:8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--line)}
.tabs .in{max-width:480px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:4px}
.tab{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; font-size:.72rem; font-weight:600; color:var(--muted); border-radius:14px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--plum)}
.tab[aria-current="page"] svg{transform:translateY(-1px)}

/* sheets */
.scrim{position:fixed; inset:0; z-index:20; background:rgba(20,8,32,.45); display:flex; align-items:flex-end; justify-content:center}
.sheet{width:100%; max-width:520px; max-height:88vh; overflow:auto; background:var(--surface); border-radius:28px 28px 0 0; padding:22px 20px calc(28px + env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column; gap:18px; animation:rise .32s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise{from{transform:translateY(40px); opacity:.4}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);align-self:center}
.sheet .stack{display:flex; flex-direction:column; gap:8px}
.sheet label.lbl{font-size:.8rem; font-weight:600; color:var(--muted)}
.sheet input[type=text]{padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--bg); width:100%}
.alist{display:flex; flex-direction:column; gap:6px}
.alist div{display:flex; align-items:center; gap:8px; padding:8px 8px 8px 14px; border-radius:14px; background:var(--surface-2)}
.alist div span{flex:1; min-width:0}
.plus-card{padding:18px; border-radius:22px; background:linear-gradient(140deg, var(--plum), var(--orchid)); color:var(--plum-ink); display:flex; flex-direction:column; gap:10px}
.plus-card h3{font-size:1.5rem}
.plus-card .btn{background:var(--plum-ink); color:var(--plum); align-self:flex-start}
.feat{display:flex; flex-direction:column; gap:10px; margin:0; padding:0; list-style:none}
.feat li{display:flex; gap:10px; align-items:flex-start}
.feat li svg{width:18px;height:18px;color:var(--plum);flex:none;margin-top:3px}
.plans{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.plan{display:flex; flex-direction:column; gap:2px; padding:14px 10px; border-radius:18px; border:2px solid var(--line); text-align:left}
.plan[aria-pressed="true"]{border-color:var(--plum); background:var(--surface-2)}
.plan .pn{font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.plan .pp{font-family:var(--display); font-size:1.35rem; font-variant-numeric:tabular-nums}
.plan .ps{font-size:.72rem; color:var(--muted)}
.tag{align-self:flex-start; font-size:.65rem; font-weight:700; padding:2px 7px; border-radius:99px; background:var(--orchid); color:var(--plum-ink); margin-bottom:4px}
.danger{color:var(--orchid); font-weight:600; font-size:.9rem; align-self:flex-start}

/* breathe */
.breathe{position:fixed; inset:0; z-index:30; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; padding:24px}
.orb{width:180px; height:180px; border-radius:46% 54% 52% 48% / 50% 46% 54% 50%; background:radial-gradient(circle at 35% 35%, var(--glow2), var(--lilac) 55%, var(--plum)); transform:scale(.6); transition:transform 4s ease-in-out; box-shadow:0 30px 80px -30px var(--plum)}
.cue{font-family:var(--display); font-size:2rem; text-align:center}

.toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:40; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:14px; font-size:.9rem; font-weight:500; max-width:calc(100% - 32px); text-align:center; animation:rise .25s ease-out}

@media (prefers-reduced-motion: reduce){
  .blob{animation:none} .sheet,.toast{animation:none} .orb{transition:none}
}
</style>

<div class="sky" aria-hidden="true"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>
<main class="app" id="app"></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

<script>
(() => {
const KEY = 'meander.v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate()+n); return ymd(d); };
const weekStart = k => addDays(k, -((parse(k).getDay()+6)%7));
const fmt = (k, o) => parse(k).toLocaleDateString('en-GB', o);
const TODAY = ymd(new Date());

/* ---------- vocabulary ---------- */
const WX = {
  storm:  {label:'Stormy',  hint:'Rough weather. Keep to your anchors; the rest can wait.'},
  fog:    {label:'Foggy',   hint:'Go slow. One or two small things is plenty today.'},
  mild:   {label:'Mild',    hint:'Steady. Plan a little and leave some room.'},
  bright: {label:'Bright',  hint:'Good energy. Maybe pull something from the drift jar.'},
  radiant:{label:'Radiant', hint:'Big energy. Spend some, and save some for tomorrow.'}
};
const WXO = ['storm','fog','mild','bright','radiant'];
const TIDES = [['morning','Morning tide'],['afternoon','Afternoon tide'],['evening','Evening tide']];
const nowTide = () => { const h = new Date().getHours(); return h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening'; };
const PROMPTS = [
  'What felt lighter than you expected today?',
  'Where did you find a little room to breathe?',
  'What would you like to leave behind tonight?',
  'Who or what made today softer?',
  'What did your body ask for today?',
  'What small thing went right?',
  'If today had a colour, what would it be and why?',
  'What can tomorrow-you skip without guilt?',
  'What surprised you today?',
  'Which moment would you like to keep?'
];
const promptFor = k => PROMPTS[Math.floor(parse(k).getTime()/864e5) % PROMPTS.length];

/* ---------- icons ---------- */
const I = {
  storm:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 16h10.5a3.5 3.5 0 0 0 0-7 5.5 5.5 0 0 0-10.6 1.2A3 3 0 0 0 7.5 16z"/><path d="M14.5 17.5l-2.4 3.6h3.4l-2.2 3.4"/></svg>',
  fog:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 10c3-1.5 5 1.5 9 0s6 1.5 9 0M6 15c3-1.5 5 1.5 8 0s5 1.5 8 0M5 20c3-1.5 5 1.5 9 0s6 1.5 9 0"/></svg>',
  mild:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7.5 20h11.5a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.4A3.3 3.3 0 0 0 7.5 20z"/></svg>',
  bright:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.5"/><path d="M10 3v1.5M3 10h1.5M5 5l1 1M15 5l-1 1"/><path d="M10.5 22h9a3.3 3.3 0 0 0 0-6.6 5 5 0 0 0-9.6 1.1 2.8 2.8 0 0 0 .6 5.5z"/></svg>',
  radiant:'<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="14" cy="14" r="4.5"/><path d="M14 3.5v2.5M14 22v2.5M3.5 14h2.5M22 14h2.5M6.6 6.6l1.8 1.8M19.6 19.6l1.8 1.8M6.6 21.4l1.8-1.8M19.6 8.4l1.8-1.8"/></svg>',
  check:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>',

  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3c.8 4.5 2.5 6.2 7 7-4.5.8-6.2 2.5-7 7-.8-4.5-2.5-6.2-7-7 4.5-.8 6.2-2.5 7-7z"/></svg>',
  tToday:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
  tWeek:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 16v-3M7 16v-6M10 16v-4M13 16V8M16 16v-5M19 16v-7"/><path d="M3 20h18"/></svg>',
  tJar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5h8M9 3.5V6C6.5 7 5.5 9 5.5 11.5v6A3 3 0 0 0 8.5 20.5h7a3 3 0 0 0 3-3v-6C18.5 9 17.5 7 15 6V3.5"/><circle cx="10" cy="14" r="1.2"/><circle cx="14" cy="12" r="1"/><circle cx="13.5" cy="16.5" r="1.3"/></svg>',
  tReflect:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg>'
};
const tideIcon = { morning:I.tToday, afternoon:I.wave, evening:I.tReflect };
const tideLine = '<svg class="tideline" viewBox="0 0 400 12" preserveAspectRatio="none" aria-hidden="true"><path d="M0 6 Q 25 0 50 6 T 100 6 T 150 6 T 200 6 T 250 6 T 300 6 T 350 6 T 400 6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';

/* ---------- state ---------- */
function seed(){
  const anchors = [
    {id:'a1', label:'Glass of water'}, {id:'a2', label:'Move for 10 minutes'},
    {id:'a3', label:'Step outside'}, {id:'a4', label:'Screens off by 11'}
  ];
  const days = {};
  const wxs = ['mild','fog','bright','mild','storm','fog','mild','bright','radiant','mild','bright','fog','mild'];
  wxs.forEach((w, i) => {
    const k = addDays(TODAY, -(wxs.length - i));
    days[k] = { weather:w, anchorsDone: anchors.filter((a, j) => (i + j*2) % 3 !== 0).map(a => a.id),
      tasks:[{id:uid(), text:'Example task', tide:'morning', done:true},{id:uid(), text:'Another example', tide:'afternoon', done: i % 2 === 0}] };
  });
  const y = addDays(TODAY, -1);
  days[y].tasks.push({id:uid(), text:'Reply to Mira about Sunday', tide:'evening', done:false});
  days[TODAY] = { weather:'mild', intention:'Keep it slow and get some daylight.', anchorsDone:['a1'],
    tasks:[
      {id:uid(), text:'Stretch before coffee', tide:'morning', done:true},
      {id:uid(), text:'Book the dentist', tide:'morning', done:false},
      {id:uid(), text:'Walk to the park, no phone', tide:'afternoon', done:false},
      {id:uid(), text:'Cook the lentil soup', tide:'evening', done:false}
    ]};
  return { v:1, name:'', example:true, theme:'system', anchors, days,
    drift:[
      {id:uid(), text:'Try the pottery class on Thursdays', added:addDays(TODAY,-9)},
      {id:uid(), text:'Reorganise the bookshelf by colour', added:addDays(TODAY,-6)},
      {id:uid(), text:'Write a letter to Grandma', added:addDays(TODAY,-3)},
      {id:uid(), text:'Sunrise swim', added:addDays(TODAY,-1)}
    ], weeks:{} };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) } catch(e) {}
if (!S || S.v !== 1) S = seed();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch(e) {} };
const blank = () => ({ weather:null, intention:'', anchorsDone:[], tasks:[], journal:'', good:['','',''] });
const day = k => S.days[k] || blank();
const ensure = k => (S.days[k] = Object.assign(blank(), S.days[k] || {}));

const ui = { view:'today', date:TODAY, week:weekStart(TODAY), tide:nowTide(), pulled:null, plan:'year' };
try { const h = location.hash.slice(1); if (['today','week','jar','reflect'].includes(h)) ui.view = h; } catch(e){}

function applyTheme(){
  const r = document.documentElement;
  if (S.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
}

/* ---------- views ---------- */
function greeting(){
  const h = new Date().getHours();
  const g = h < 5 ? 'Still up' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  return S.name ? `${g}, ${esc(S.name)}` : g;
}

function weatherPicker(k){
  const d = day(k);
  return `<section class="weather" aria-label="Inner weather">
    <p class="eyebrow">Inner weather</p>
    <div class="wx-row">${WXO.map(w => `<button class="wx" style="--wc:var(--w-${w})" data-act="wx" data-v="${w}" aria-pressed="${d.weather===w}">${I[w]}${WX[w].label}</button>`).join('')}</div>
    <p class="pace">${d.weather ? WX[d.weather].hint : 'How does today feel from the inside? Pick one and the plan will meet you there.'}</p>
  </section>`;
}

function viewToday(){
  const k = ui.date, d = day(k), isToday = k === TODAY;
  const label = fmt(k, {weekday:'long', day:'numeric', month:'long'});
  const title = isToday ? greeting() : (k < TODAY ? 'Looking back' : 'Planning ahead');
  const doneA = S.anchors.filter(a => d.anchorsDone.includes(a.id)).length;
  const tasksDone = d.tasks.filter(t => t.done).length;

  let carry = '';
  if (isToday && !d.carried){
    const open = day(addDays(TODAY,-1)).tasks.filter(t => !t.done);
    if (open.length) carry = `<div class="note">
      <p><strong>${open.length} thing${open.length>1?'s':''} from yesterday ${open.length>1?'are':'is'} still open.</strong> <span class="muted">That's fine. Where should ${open.length>1?'they':'it'} go?</span></p>
      <div class="row"><button class="btn" data-act="carry">Bring along</button><button class="btn ghost" data-act="carryjar">Put in the jar</button><button class="btn line" data-act="carryskip">Let go</button></div></div>`;
  }
  const example = S.example ? `<div class="note"><p><strong>These are example entries</strong> <span class="muted">so you can see how Meander works.</span></p>
    <div class="row"><button class="btn" data-act="clearex">Start fresh</button><button class="btn ghost" data-act="settings">Make it yours</button></div></div>` : '';

  return `
  <header class="top">
    <div class="grow">
      <p class="eyebrow">${esc(label)}</p>
      <h1>${title}</h1>
      ${isToday ? '' : `<div><button class="backtoday" data-act="gotoday">Back to today</button></div>`}
    </div>
    <div class="daynav">
      <button class="iconbtn" data-act="prevday" aria-label="Previous day">${I.left}</button>
      <button class="iconbtn" data-act="nextday" aria-label="Next day">${I.right}</button>
    </div>
  </header>
  ${weatherPicker(k)}
  ${example}${carry}
  <section class="card" aria-label="Intention">
    <p class="eyebrow">Today, I'd like to</p>
    <textarea class="intent" id="intent" rows="1" data-bind="intention" placeholder="feel... / make room for... / remember...">${esc(d.intention)}</textarea>
  </section>
  <section class="sec">
    <div class="sec-head"><h2>Anchors</h2><span class="count">${doneA} of ${S.anchors.length}</span></div>
    <p class="muted small">The small steady things. Do them whatever the weather.</p>
    <div class="anchors">${S.anchors.map(a => `<button class="anchor" data-act="anchor" data-id="${a.id}" aria-pressed="${d.anchorsDone.includes(a.id)}"><span class="dot">${I.check}</span>${esc(a.label)}</button>`).join('') || '<p class="empty">Add anchors in settings.</p>'}</div>
  </section>
  ${tideLine}
  <section class="sec">
    <div class="sec-head"><h2>Tides</h2><span class="count">${tasksDone} of ${d.tasks.length} done</span></div>
    <p class="muted small">No clock times. Just roughly when it feels right.</p>
    <form class="adder" data-form="task" autocomplete="off">
      <div class="field"><input id="newtask" name="t" placeholder="Add something for ${isToday?'today':'this day'}" aria-label="New task"><button class="btn" type="submit">Add</button></div>
      <div class="seg" role="group" aria-label="Tide">${TIDES.map(([t,n]) => `<button type="button" data-act="settide" data-v="${t}" aria-pressed="${ui.tide===t}">${n.split(' ')[0]}</button>`).join('')}</div>
    </form>
    <div class="card">
      ${TIDES.map(([t,n]) => {
        const list = d.tasks.filter(x => x.tide === t);
        return `<div class="tide"><div class="tide-name">${tideIcon[t]}${n}</div>
          ${list.length ? list.map(x => `<div class="task ${x.done?'done':''}">
            <button class="check" data-act="toggle" data-id="${x.id}" aria-label="${x.done?'Mark not done':'Mark done'}: ${esc(x.text)}">${I.check}</button>
            <span class="txt">${esc(x.text)}</span>
            <button class="mini" data-act="shift" data-id="${x.id}" aria-label="Move to next tide">${I.shift}</button>
            <button class="mini" data-act="letgo" data-id="${x.id}" aria-label="Move to drift jar">${I.jarIn}</button>
          </div>`).join('') : `<p class="empty">${t==='evening'?'Open water. Rest counts.':'Nothing here yet.'}</p>`}
        </div>`;
      }).join('')}
    </div>
  </section>`;
}

function viewWeek(){
  const ws = ui.week, we = addDays(ws, 6);
  const wk = S.weeks[ws] || '';
  const rows = [...Array(7)].map((_, i) => {
    const k = addDays(ws, i), d = day(k);
    const tot = d.tasks.length, dn = d.tasks.filter(t => t.done).length;
    const an = S.anchors.filter(a => d.anchorsDone.includes(a.id)).length;
    return `<button class="daycard ${k===TODAY?'today':''}" data-act="openday" data-k="${k}">
      <span class="wblob ${d.weather?'':'none'}" style="${d.weather?`--wc:var(--w-${d.weather})`:''}" aria-label="${d.weather?WX[d.weather].label:'No weather logged'}"></span>
      <span style="min-width:0">
        <span class="dname">${fmt(k,{weekday:'long'})}${k===TODAY?' · today':''}</span>
        <span class="dsub" style="display:block">${fmt(k,{day:'numeric',month:'short'})} · ${tot ? `${dn}/${tot} done` : 'open day'} · ${an}/${S.anchors.length} anchors</span>
        <span class="bar" style="display:block"><i style="width:${tot?Math.round(dn/tot*100):0}%"></i></span>
      </span>
      <span class="muted">${I.right.replace('<svg','<svg width="18" height="18"')}</span>
    </button>`;
  }).join('');
  return `
  <header class="weekhead">
    <div class="grow"><p class="eyebrow">${fmt(ws,{day:'numeric',month:'short'})} – ${fmt(we,{day:'numeric',month:'short'})}</p><h1>${ws===weekStart(TODAY)?'This week':'A week of days'}</h1></div>
    <button class="iconbtn" data-act="prevweek" aria-label="Previous week">${I.left}</button>
    <button class="iconbtn" data-act="nextweek" aria-label="Next week">${I.right}</button>
  </header>
  <section class="card">
    <p class="eyebrow">This week I'd like to feel</p>
    <textarea class="intent" id="weeknote" rows="2" data-bind="week" placeholder="rested, curious, a bit braver...">${esc(wk)}</textarea>
  </section>
  <section class="days" aria-label="Days">${rows}</section>
  <p class="muted small">Tap a day to plan it. Unplanned days are allowed.</p>`;
}

function viewJar(){
  const pulled = ui.pulled && S.drift.find(x => x.id === ui.pulled);
  return `
  <header class="top"><div class="grow"><p class="eyebrow">${S.drift.length} idea${S.drift.length===1?'':'s'} floating</p><h1>Drift jar</h1>
  <p class="muted">Things you'd like to do someday, with no deadline. Pull one out when you have room.</p></div></header>
  <form class="field" data-form="drift" autocomplete="off"><input id="newdrift" name="t" placeholder="Someday I'd like to..." aria-label="New idea"><button class="btn" type="submit">Drop in</button></form>
  ${pulled ? `<section class="card pull" aria-live="polite"><p class="eyebrow">From the jar</p><p class="pulled">${esc(pulled.text)}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="drifttoday" data-id="${pulled.id}">Do it today</button><button class="btn ghost" data-act="pull">Another one</button><button class="btn line" data-act="unpull">Not now</button></div></section>`
  : `<button class="btn" style="align-self:flex-start;display:flex;gap:8px;align-items:center" data-act="pull" ${S.drift.length?'':'disabled'}><span style="width:18px;height:18px;display:inline-block">${I.spark}</span>Pull one out</button>`}
  <section class="card"><div class="drifts">
    ${S.drift.length ? S.drift.slice().reverse().map(x => `<div class="drift"><div class="txt">${esc(x.text)}<div class="when">dropped in ${fmt(x.added,{day:'numeric',month:'short'})}</div></div>
      <button class="chip" data-act="drifttoday" data-id="${x.id}">To today</button>
      <button class="iconbtn" style="width:34px;height:34px" data-act="driftdel" data-id="${x.id}" aria-label="Remove idea">${I.x}</button></div>`).join('')
      : '<p class="empty" style="padding-left:0">The jar is empty. Drop in anything that makes you curious.</p>'}
  </div></section>`;
}

function viewReflect(){
  const k = ui.date === TODAY || ui.date > TODAY ? TODAY : ui.date;
  const d = day(k);
  const hist = [...Array(14)].map((_, i) => addDays(TODAY, i-13));
  const last7 = hist.slice(7);
  const counts = {}; hist.forEach(h => { const w = day(h).weather; if (w) counts[w] = (counts[w]||0)+1; });
  const top = Object.entries(counts).sort((a,b) => b[1]-a[1])[0];
  return `
  <header class="top"><div class="grow"><p class="eyebrow">${fmt(k,{weekday:'long', day:'numeric', month:'long'})}</p><h1>Reflect</h1></div></header>
  <section class="card">
    <p class="eyebrow">Tonight's question</p>
    <p class="prompt">${promptFor(k)}</p>
    <textarea class="journal" id="journal" data-bind="journal" placeholder="Write as much or as little as you like.">${esc(d.journal)}</textarea>
  </section>
  <section class="card">
    <p class="eyebrow">Three good things</p>
    <div class="good">${[0,1,2].map(i => `<label><span>${['i','ii','iii'][i]}</span><input type="text" id="good${i}" data-bind="good" data-i="${i}" value="${esc((d.good||[])[i]||'')}" aria-label="Good thing ${i+1}"></label>`).join('')}</div>
  </section>
  ${tideLine}
  <section class="sec">
    <div class="sec-head"><h2>Your weather</h2><span class="count">last 14 days</span></div>
    <div class="history">${hist.map(h => { const w = day(h).weather; return `<div><span class="wblob ${w?'':'none'}" style="${w?`--wc:var(--w-${w})`:''}" title="${fmt(h,{day:'numeric',month:'short'})}: ${w?WX[w].label:'not logged'}"></span>${fmt(h,{weekday:'narrow'})}</div>`; }).join('')}</div>
    <div class="legend">${WXO.map(w => `<span style="--wc:var(--w-${w})"><i></i>${WX[w].label}</span>`).join('')}</div>
    <p class="muted small">${top ? `Mostly ${WX[top[0]].label.toLowerCase()} lately (${top[1]} of 14 days). Weather passes. Your anchors stay.` : 'Log your inner weather on the Today tab and patterns will show up here.'}</p>
  </section>
  <section class="sec">
    <div class="sec-head"><h2>Anchor rhythm</h2><span class="count">last 7 days</span></div>
    <div class="card"><div class="rhythm">
      <span></span>${last7.map(h => `<span class="h">${fmt(h,{weekday:'narrow'})}</span>`).join('')}
      ${S.anchors.map(a => `<span class="lbl">${esc(a.label)}</span>${last7.map(h => `<span class="d ${day(h).anchorsDone.includes(a.id)?'on':''}"></span>`).join('')}`).join('')}
    </div></div>
    <p class="muted small">No streaks to break here. Every filled dot counts on its own.</p>
  </section>
  <section class="note">
    <p><strong>Two-minute pause.</strong> <span class="muted">Breathe in for 4, hold for 4, out for 6.</span></p>
    <div class="row"><button class="btn" data-act="breathe">Start breathing</button></div>
  </section>`;
}

function renderTabs(){
  const t = [['today','Today',I.tToday],['week','Week',I.tWeek],['jar','Drift jar',I.tJar],['reflect','Reflect',I.tReflect]];
  $('#tabs').innerHTML = t.map(([v,n,ic]) => `<button class="tab" data-act="tab" data-v="${v}" ${ui.view===v?'aria-current="page"':''}>${ic}${n}</button>`).join('');
}

function render(){
  const app = $('#app');
  app.innerHTML = ({today:viewToday, week:viewWeek, jar:viewJar, reflect:viewReflect})[ui.view]();
  const head = app.querySelector('.top, .weekhead');
  if (head && ui.view !== 'today' && !head.querySelector('[data-act="settings"]')) head.insertAdjacentHTML('beforeend', `<button class="iconbtn" data-act="settings" aria-label="Settings">${I.gear}</button>`);
  if (ui.view === 'today') app.querySelector('.daynav').insertAdjacentHTML('beforeend', `<button class="iconbtn" data-act="settings" aria-label="Settings">${I.gear}</button>`);
  renderTabs();
  app.querySelectorAll('textarea.intent').forEach(autosize);
}
function autosize(el){ el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

/* ---------- sheets ---------- */
function openSheet(html){
  $('#layer').innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  const f = $('#layer .sheet button, #layer .sheet input'); if (f) f.focus({preventScroll:true});
}
const closeSheet = () => { $('#layer').innerHTML = ''; };

  openSheet(`
    <h2>Make it yours</h2>

      <input type="text" id="sname" data-bind="name" value="${esc(S.name)}" placeholder="Your name"></div>
    <div class="stack"><span class="lbl">Your anchors</span>
      <div class="alist">${S.anchors.map(a => `<div><span>${esc(a.label)}</span><button class="iconbtn" style="width:32px;height:32px" data-act="delanchor" data-id="${a.id}" aria-label="Remove ${esc(a.label)}">${I.x}</button></div>`).join('')}</div>
      <form class="field" data-form="anchor" autocomplete="off"><input id="newanchor" name="t" placeholder="e.g. Ten pages of a book" aria-label="New anchor"><button class="btn" type="submit">Add</button></form>

    <div class="stack"><span class="lbl">Appearance</span>
      <div class="seg">${[['system','Auto'],['light','Light'],['dark','Dark']].map(([v,n]) => `<button data-act="theme" data-v="${v}" aria-pressed="${S.theme===v}">${n}</button>`).join('')}</div></div>
    <div class="plus-card"><p class="eyebrow" style="color:inherit;opacity:.8">Meander Plus</p><h3>Gentle insights, sync and palettes</h3>
      <button class="btn" data-act="plus">See Plus</button></div>
    ${S.example ? '<button class="danger" data-act="clearex">Clear example entries</button>' : ''}
    ${confirmErase ? `<div class="note"><p><strong>Erase everything?</strong> <span class="muted">Your days, anchors and drift jar will be gone from this device.</span></p>
      <div class="row"><button class="btn" data-act="erase2">Yes, erase</button><button class="btn ghost" data-act="settings">Keep my data</button></div></div>`
      : '<button class="danger" data-act="erase">Erase all data</button>'}
    <button class="btn ghost" data-act="close">Done</button>`);
}

function plusSheet(){
  const plans = [['month','Monthly','€3.99','per month',''],['year','Yearly','€29.99','€2.50 a month','Save 37%'],['life','Lifetime','€59','pay once','']];

    <div class="plans">${plans.map(([v,n,p,s,tag]) => `<button class="plan" data-act="plan" data-v="${v}" aria-pressed="${ui.plan===v}">${tag?`<span class="tag">${tag}</span>`:''}<span class="pn">${n}</span><span class="pp">${p}</span><span class="ps">${s}</span></button>`).join('')}</div>
    <button class="btn" data-act="buy">Start 14-day free trial</button>

let breathTimer = null;
function breathe(){
  const phases = [['Breathe in', 4000, 1], ['Hold', 4000, 1], ['Breathe out', 6000, .6]];
  let i = 0, rounds = 0;
  $('#layer').innerHTML = `<div class="breathe" role="dialog" aria-modal="true" aria-label="Breathing pause"><div class="orb" id="orb"></div><p class="cue" id="cue" aria-live="polite">Settle in</p><button class="btn ghost" data-act="endbreathe">I'm done</button></div>`;
  const step = () => {
    if (rounds >= 8) { $('#cue').textContent = 'Welcome back'; breathTimer = setTimeout(endBreathe, 2200); return; }
    const [txt, ms, sc] = phases[i];
    $('#cue').textContent = txt;
    const orb = $('#orb'); orb.style.transitionDuration = ms + 'ms'; orb.style.transform = `scale(${sc})`;
    i = (i + 1) % 3; if (i === 0) rounds++;
    breathTimer = setTimeout(step, ms);
  };
  breathTimer = setTimeout(step, 900);
}
function endBreathe(){ clearTimeout(breathTimer); closeSheet(); }

let toastT;
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}

/* ---------- actions ---------- */
function findTask(id){ const d = ensure(ui.date); return [d, d.tasks.find(t => t.id === id)]; }
const ACT = {
  tab(el){ ui.view = el.dataset.v; if (ui.view === 'today') ui.date = ui.date || TODAY; window.scrollTo(0,0); },
  wx(el){ const d = ensure(ui.date); d.weather = d.weather === el.dataset.v ? null : el.dataset.v; },
  anchor(el){ const d = ensure(ui.date), id = el.dataset.id; d.anchorsDone = d.anchorsDone.includes(id) ? d.anchorsDone.filter(x => x !== id) : [...d.anchorsDone, id]; },
  settide(el){ ui.tide = el.dataset.v; const i = $('#newtask'); const val = i.value; render(); $('#newtask').value = val; $('#newtask').focus(); return 'norender'; },
  toggle(el){ const [, t] = findTask(el.dataset.id); if (t) t.done = !t.done; },
  shift(el){ const [, t] = findTask(el.dataset.id); if (!t) return; const o = TIDES.map(x => x[0]); t.tide = o[(o.indexOf(t.tide)+1) % 3]; },
  letgo(el){ const [d, t] = findTask(el.dataset.id); if (!t) return; d.tasks = d.tasks.filter(x => x !== t); S.drift.push({id:uid(), text:t.text, added:TODAY}); toast('Moved to the drift jar. It will keep.'); },
  prevday(){ ui.date = addDays(ui.date, -1); }, nextday(){ ui.date = addDays(ui.date, 1); }, gotoday(){ ui.date = TODAY; },
  prevweek(){ ui.week = addDays(ui.week, -7); }, nextweek(){ ui.week = addDays(ui.week, 7); },
  openday(el){ ui.date = el.dataset.k; ui.view = 'today'; window.scrollTo(0,0); },
  carry(){ const y = ensure(addDays(TODAY,-1)), d = ensure(TODAY); const open = y.tasks.filter(t => !t.done);
    y.tasks = y.tasks.filter(t => t.done); open.forEach(t => d.tasks.push({...t, id:uid()})); d.carried = true; toast(`Brought ${open.length} along.`); },
  carryjar(){ const y = ensure(addDays(TODAY,-1)); const open = y.tasks.filter(t => !t.done);
    y.tasks = y.tasks.filter(t => t.done); open.forEach(t => S.drift.push({id:uid(), text:t.text, added:TODAY})); ensure(TODAY).carried = true; toast('Safely in the jar.'); },
  carryskip(){ ensure(TODAY).carried = true; toast('Let go. Yesterday is done.'); },
  clearex(){ S.days = {}; S.drift = []; S.weeks = {}; S.example = false; closeSheet(); toast('A fresh start. Pick your inner weather to begin.'); },
  pull(){ const pool = S.drift.filter(x => x.id !== ui.pulled); const src = pool.length ? pool : S.drift; if (!src.length) return; ui.pulled = src[Math.floor(Math.random()*src.length)].id; },
  unpull(){ ui.pulled = null; },
  drifttoday(el){ const x = S.drift.find(d => d.id === el.dataset.id); if (!x) return; S.drift = S.drift.filter(d => d !== x);
    ensure(TODAY).tasks.push({id:uid(), text:x.text, tide:nowTide(), done:false}); ui.pulled = null; toast('Added to today\'s ' + nowTide() + ' tide.'); },
  driftdel(el){ S.drift = S.drift.filter(d => d.id !== el.dataset.id); },
  breathe(){ breathe(); return 'norender'; }, endbreathe(){ endBreathe(); return 'norender'; },
  settings(){ settingsSheet(false); return 'keep'; },
  plus(){ plusSheet(); return 'norender'; },
  plan(el){ ui.plan = el.dataset.v; plusSheet(); return 'norender'; },
  buy(){ toast('Checkout is not connected in this preview yet.'); return 'norender'; },
  theme(el){ S.theme = el.dataset.v; applyTheme(); settingsSheet(false); return 'keep'; },
  delanchor(el){ S.anchors = S.anchors.filter(a => a.id !== el.dataset.id); settingsSheet(false); return 'keep'; },
  erase(){ settingsSheet(true); return 'norender'; },
  erase2(){ try { localStorage.removeItem(KEY) } catch(e){} S = seed(); S.example = false; S.days = {}; S.drift = []; closeSheet(); applyTheme(); toast('Everything is cleared.'); },
  close(){ closeSheet(); },
  scrim(el, e){ if (e.target === el) closeSheet(); return 'norender'; }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  const r = fn(el, e);
  if (r === 'norender') return;
  save(); render();
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, v = (f.t.value || '').trim();
  if (!v) return;
  if (kind === 'task'){ ensure(ui.date).tasks.push({id:uid(), text:v, tide:ui.tide, done:false}); save(); render(); $('#newtask').focus(); }
  if (kind === 'drift'){ S.drift.push({id:uid(), text:v, added:TODAY}); save(); render(); $('#newdrift').focus(); toast('Dropped in the jar.'); }
  if (kind === 'anchor'){ if (S.anchors.length >= 8) { toast('Eight anchors is the limit. Fewer keeps it gentle.'); return; } S.anchors.push({id:uid(), label:v}); save(); settingsSheet(false); render(); $('#newanchor').focus(); }
});

document.addEventListener('input', e => {
  const el = e.target, b = el.dataset.bind; if (!b) return;
  if (b === 'intention') { ensure(ui.date).intention = el.value; autosize(el); }
  if (b === 'week') { S.weeks[ui.week] = el.value; autosize(el); }
  if (b === 'journal') { ensure(ui.date > TODAY ? TODAY : ui.date).journal = el.value; }
  if (b === 'good') { const d = ensure(ui.date > TODAY ? TODAY : ui.date); d.good = d.good || ['','','']; d.good[+el.dataset.i] = el.value; }
  if (b === 'name') { S.name = el.value.trim().slice(0, 30); }
  save();
});
document.addEventListener('change', e => { if (e.target.dataset.bind === 'name') render(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#layer').innerHTML) { endBreathe(); }
  if (e.key === 'Enter' && e.target.classList.contains('intent')) { e.preventDefault(); e.target.blur(); }
});

applyTheme();
render();
})();
</script>
